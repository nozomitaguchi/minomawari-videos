<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>はなみずの いろ：かぜの鼻水は、どうして黄色くなるの？</title>
<style>
  html, body { margin: 0; padding: 0; background: #fffaf0; }
  body { width: 1920px; height: 1080px; overflow: hidden; position: relative;
         font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; }
  #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #cap { position: absolute; left: 0; right: 0; bottom: 46px; display: flex; justify-content: center; pointer-events: none; }
  #cap span { display: inline-block; max-width: 1640px; padding: 18px 44px 20px; border-radius: 22px;
              background: rgba(30, 29, 25, 0.84); color: #fff; font-size: 52px; font-weight: 700;
              letter-spacing: 0.04em; line-height: 1.45; text-align: center; white-space: pre-line; }
  #cap span.night { background: rgba(255, 250, 240, 0.92); color: #1e1d19; }
  #cap span:empty { display: none; }
</style>
</head>
<body>
<svg id="measure" width="0" height="0" style="position:absolute;visibility:hidden" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="cap"><span></span></div>
<script src="timeline.js"></script>
<script src="scenes.js"></script>
<script src="characters.js"></script>
<script>
function drawThumb() {
  NOW = { i: 1, t: 3 };
  let o = DEFS + `<rect width="1920" height="1080" fill="${MC.room}"/><rect y="930" width="1920" height="150" fill="${MC.floor}"/>`;
  // かぜをひいた子（黄色い鼻水）
  o += `<circle cx="1500" cy="760" r="330" fill="#fff" opacity="0.55"/>`;
  o += g(sickFace(1.0, { col: MC.yellow, drip: 1 }), { x: 1500, y: 760, s: 1.75 });
  // ティッシュ：とうめい → きいろ
  o += g(tissuePic(MC.clear, 1.3), { x: 200, y: 830 }) + arrow2(345, 830, 435, 830, C.ochre, 24) + g(tissuePic(MC.yellow, 1.55), { x: 620, y: 820 });
  o += `<text x="1780" y="230" font-size="250" font-weight="900" fill="${C.ochre}" stroke="#fffaf0" stroke-width="26" stroke-linejoin="round" paint-order="stroke" text-anchor="middle" dominant-baseline="middle" transform="rotate(12 1780 230)">？</text>`;
  o += g(wbc2(0, 0, 70, 0.4, { i: 1 }), { x: 1160, y: 560 });
  o += `<g transform="translate(960 1076) scale(0.8)">${sister(1.3, { pose: 'point', eyes: 'wide', mouth: 'o', look: [8, -2] })}</g>`;
  const T = (x, y, inner, size) => `<text x="${x}" y="${y}" font-size="${size}" font-weight="900" letter-spacing="0.02em" fill="${C.ink}" stroke="#fffaf0" stroke-width="26" stroke-linejoin="round" paint-order="stroke" dominant-baseline="middle">${inner}</text>`;
  o += T(50, 170, `かぜの 鼻水は`, 156);
  o += T(50, 380, `なぜ <tspan fill="${MC.yellowDk}">黄色く</tspan>なる？`, 150);
  o += g(badge('みのまわり図鑑', { fill: C.accent, size: 54, pad: 50 }), { x: 290, y: 570 });
  document.getElementById('stage').innerHTML = o;
  document.getElementById('cap').style.display = 'none';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ゆげと しろい いき：寒いとき、湯気や白い息が見えるのはなぜ？</title>
<style>
  html, body { margin: 0; padding: 0; background: #fffaf0; }
  body { width: 1920px; height: 1080px; overflow: hidden; position: relative;
         font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; }
  #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #cap { position: absolute; left: 0; right: 0; bottom: 46px; display: flex; justify-content: center; pointer-events: none; }
  #cap span { display: inline-block; max-width: 1640px; padding: 18px 44px 20px; border-radius: 22px;
              background: rgba(30, 29, 25, 0.84); color: #fff; font-size: 52px; font-weight: 700;
              letter-spacing: 0.04em; line-height: 1.45; text-align: center; white-space: pre-line; }
  #cap span.night { background: rgba(255, 250, 240, 0.92); color: #1e1d19; }
  #cap span:empty { display: none; }
</style>
</head>
<body>
<svg id="measure" width="0" height="0" style="position:absolute;visibility:hidden" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="cap"><span></span></div>
<script src="timeline.js"></script>
<script src="scenes.js"></script>
<script src="characters.js"></script>
<script>
function drawThumb() {
  NOW = { i: 1, t: 3 };
  let o = DEFS + skyG('thsky', '#6fa8d8', '#c6def0');
  o += `<path d="M 0 900 Q 500 800 1000 900 T 1920 880 L 1920 1080 L 0 1080 Z" fill="${WB.snowDk}"/><rect x="0" y="980" width="1920" height="100" fill="${WB.snow}"/>`;
  // おとうとの白い息
  [[1410, 800, 44], [1320, 780, 70], [1190, 752, 96], [1040, 720, 120]].forEach(([x, y, r]) => { o += puff(x, y, r, 1); });
  o += `<g transform="translate(1600 1070) scale(1.15)">${brother(2.1, { eyes: 'wide', mouth: 'o', look: [-8, 0] })}</g>`;
  // ルーペ：白いものの中は、小さな水のつぶ
  let inn = `<rect x="520" y="430" width="560" height="560" fill="#f1f5f8"/>`;
  for (let i = 0; i < 20; i++) { const a = rnd(i, 3) * 6.28, d = Math.sqrt(rnd(i, 4)) * 210; inn += dot(800 + Math.cos(a) * d, 710 + Math.sin(a) * d, 24, 1); }
  o += lens(800, 710, 250, inn, { id: 'thl' });
  const T = (x, y, inner, size) => `<text x="${x}" y="${y}" font-size="${size}" font-weight="900" letter-spacing="0.02em" fill="${C.ink}" stroke="#fffaf0" stroke-width="28" stroke-linejoin="round" paint-order="stroke" dominant-baseline="middle">${inner}</text>`;
  o += T(50, 170, `<tspan fill="${WB.coldDk}">しろい いき</tspan>の`, 156);
  o += T(50, 370, `しょうたいは？`, 156);
  o += g(badge('みのまわり図鑑', { fill: C.accent, size: 54, pad: 50 }), { x: 290, y: 560 });
  document.getElementById('stage').innerHTML = o;
  document.getElementById('cap').style.display = 'none';
}
</script>
</body>
</html>

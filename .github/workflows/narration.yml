name: みのまわり図鑑のナレーション

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/narration.yml'
      - 'narrate_gemini.py'

permissions:
  contents: write

concurrency:
  group: minomawari-narration-main
  cancel-in-progress: false

jobs:
  check_api_connection:
    if: github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<3'
      - name: Check Gemini API credentials and next voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from narrate_gemini import MODEL, VOICES, next_voice, request, voice_id

          key = os.environ.get("GEMINI_API_KEY")
          if not key:
              raise SystemExit("GEMINI_API_KEY is not configured")
          request(key, f"/models/{MODEL}")
          voice, _ = next_voice(VOICES.read_text())
          voice_id(key, voice)
          print(f"Gemini API connection verified: {MODEL}, {voice}")
          PY

  narrate:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<3'
      - name: Generate the next batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python narrate_gemini.py
      - name: Preserve generated audio if post-processing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: narration-wav-for-review
          path: ${{ runner.temp }}/*.wav
          if-no-files-found: ignore

name: 4K書き出し・YouTube非公開アップロード
run-name: "${{ inputs.slug }} / ${{ inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "VIDEOS.md の完成動画ID (例: scab)"
        required: true
        type: string
      mode:
        description: "@minomawari-zukan に同じ動画が未登録なら、非公開アップロードを選択できます"
        required: true
        type: choice
        default: render-only
        options:
          - render-only
          - upload-private
      made_for_kids:
        description: "子ども向け設定 (アップロード時は必ず選択)"
        type: choice
        default: choose-for-upload
        options:
          - choose-for-upload
          - "yes"
          - "no"
      synthetic_media:
        description: "YouTube の申告対象となるリアルな改変・合成コンテンツを含むか (アップロード時は必ず選択)"
        type: choice
        default: choose-for-upload
        options:
          - choose-for-upload
          - "yes"
          - "no"

permissions:
  contents: write

concurrency:
  group: youtube-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VIDEO_SLUG: ${{ inputs.slug }}
      UPLOAD_MODE: ${{ inputs.mode }}
      MADE_FOR_KIDS: ${{ inputs.made_for_kids }}
      SYNTHETIC_MEDIA: ${{ inputs.synthetic_media }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check finished video and upload options
        run: |
          if [[ "$UPLOAD_MODE" == upload-private ]]; then
            python tools/youtube_upload.py check "$VIDEO_SLUG" --kids "$MADE_FOR_KIDS" --synthetic "$SYNTHETIC_MEDIA"
          else
            python tools/youtube_upload.py check "$VIDEO_SLUG"
          fi
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install 'numpy>=2,<3' 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Render and verify 4K MP4
        run: |
          sh "$VIDEO_SLUG/finish.sh"
          python tools/youtube_upload.py verify "$VIDEO_SLUG"
          printf '%s\n' '3840×2160 の映像と音声を確認しました。' >> "$GITHUB_STEP_SUMMARY"
      - name: Install YouTube API client
        if: inputs.mode == 'upload-private'
        run: python -m pip install 'google-api-python-client>=2,<3'
      - name: Upload privately to @minomawari-zukan
        if: inputs.mode == 'upload-private'
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
        run: |
          python tools/youtube_upload.py upload "$VIDEO_SLUG" --kids "$MADE_FOR_KIDS" --synthetic "$SYNTHETIC_MEDIA"

<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;font-family:"Noto Sans CJK JP",sans-serif}svg{display:block}</style></head>
<body>
<svg id="measure" width="0" height="0" style="position:absolute;visibility:hidden" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="cap"><span></span></div>
<script src="timeline.js"></script>
<script src="scenes.js"></script>
<script src="characters.js"></script>
<script>
const s = document.getElementById('s');
function make(kind) {
  let W, H, o = '';
  if (kind === 'icon') {
    W = 800; H = 800;
    o += `<circle cx="400" cy="400" r="400" fill="${C.accent}"/>`;
    o += `<circle cx="400" cy="400" r="330" fill="${C.paper}"/>`;
    o += `<g transform="translate(330 560) scale(1.55)">${chameleon(2.0, { holdLens: true, eyeL: 10, eyeR: -60 })}</g>`;
  } else if (kind === 'banner') {
    W = 2560; H = 1440;
    o += `<rect width="${W}" height="${H}" fill="${C.paper}"/>`;
    o += `<circle cx="1280" cy="720" r="1500" fill="none" stroke="${C.accentSoft}" stroke-width="140"/>`;
    // 安全領域 1546x423（中央 x507-2053, y508-931）
    o += `<text x="1290" y="690" font-size="124" font-weight="900" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.04em"><tspan fill="${C.accent}">み</tspan><tspan fill="${C.blueUi}">の</tspan><tspan fill="${C.redUi}">ま</tspan><tspan fill="${C.ochre}">わ</tspan><tspan fill="${C.accent}">り</tspan><tspan fill="${C.ink}">図鑑</tspan></text>`;
    o += `<text x="1290" y="815" font-size="44" font-weight="700" fill="${C.muted}" text-anchor="middle" dominant-baseline="middle">まいにち見ているものを、前より くわしく。</text>`;
    o += `<g transform="translate(610 915) scale(0.6)">${sister(2.0, { pose: 'wave', eyes: 'smile', mouth: 'open' })}</g>`;
    o += `<g transform="translate(745 915) scale(0.6)">${brother(2.0, { pose: 'point', eyes: 'open', mouth: 'open', look: [5, -4] })}</g>`;
    o += `<g transform="translate(1835 905) scale(0.72)">${chameleon(2.0, { holdLens: true, eyeL: 20, eyeR: -140 })}</g>`;
    o += `<g transform="translate(150 150) scale(1.3)">${signalH(0, 0, { g: 1 })}</g>`;
    o += `<g transform="translate(2300 1220)">${lamp(0, 0, 70, C.yellow, 1)}</g>`;
    o += `<g transform="translate(2420 1320)">${lamp(0, 0, 40, C.red, 1)}</g>`;
  } else {
    W = 1280; H = 720;
    o += `<rect width="${W}" height="${H}" fill="${C.paper}"/>`;
    o += `<rect x="0" y="560" width="1280" height="160" fill="${C.accentSoft}"/>`;
    o += `<g transform="translate(70 70) scale(1.25)">${signalH(0, 0, { g: 1 })}</g>`;
    o += `<text x="70" y="370" font-size="120" font-weight="900" fill="${C.ink}" letter-spacing="0.02em"><tspan fill="${C.green}">緑</tspan>なのに</text>`;
    o += `<text x="70" y="520" font-size="130" font-weight="900" fill="${C.ink}" letter-spacing="0.02em">「<tspan fill="${C.blue}">青</tspan>信号」？</text>`;
    o += `<g transform="translate(1060 690) scale(0.95)">${sister(2.0, { pose: 'think', eyes: 'wide', mouth: 'o', look: [-6, -6] })}</g>`;
    o += `<g transform="translate(1100 160)">${bubble(170, 120, '？', { size: 80 })}</g>`;
    o += `<rect x="70" y="600" width="360" height="74" rx="37" fill="${C.accent}"/><text x="250" y="639" font-size="40" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">みのまわり図鑑</text>`;
  }
  s.setAttribute('width', W); s.setAttribute('height', H); s.setAttribute('viewBox', `0 0 ${W} ${H}`);
  s.innerHTML = DEFS + o;
}
window.make = make;
</script>
</body></html>

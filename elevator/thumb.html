<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>エレベーター：どうやって上がる？</title>
<style>
  html, body { margin: 0; padding: 0; background: #fffaf0; }
  body { width: 1920px; height: 1080px; overflow: hidden; position: relative;
         font-family: "Noto Sans CJK JP", "IPAGothic", sans-serif; }
  #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #cap { position: absolute; left: 0; right: 0; bottom: 46px; display: flex; justify-content: center; pointer-events: none; }
  #cap span { display: inline-block; max-width: 1640px; padding: 18px 44px 20px; border-radius: 22px;
              background: rgba(30, 29, 25, 0.84); color: #fff; font-size: 52px; font-weight: 700;
              letter-spacing: 0.04em; line-height: 1.45; text-align: center; white-space: pre-line; }
  #cap span.night { background: rgba(255, 250, 240, 0.92); color: #1e1d19; }
  #cap span:empty { display: none; }
</style>
</head>
<body>
<svg id="measure" width="0" height="0" style="position:absolute;visibility:hidden" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="cap"><span></span></div>
<script src="timeline.js"></script>
<script src="scenes.js"></script>
<script src="characters.js"></script>
<script>
function drawThumb() {
  let o = DEFS + `<rect width="1920" height="1080" fill="${C.paper}"/>`;
  // 右：エレベーターのしくみ（大きく）
  o += `<g transform="translate(1440 120) scale(1.55) translate(-960 -60)">`;
  o += `<rect x="730" y="250" width="380" height="520" fill="${EL.shaft}"/><rect x="660" y="56" width="600" height="194" rx="12" fill="${EL.room}"/>`;
  o += `<path d="M 870 160 A 90 90 0 0 1 1050 160" fill="none" stroke="${EL.rope}" stroke-width="10"/>` + sheave(960, 160, 90, 0.3);
  o += ropeLine(870, 160, 870, 486, 3) + cageBox(870, 500, 230, 180, { kids: 1, t: 0.3 });
  o += ropeLine(1050, 160, 1050, 330, 3) + `<rect x="1018" y="330" width="64" height="170" rx="8" fill="${EL.weight}"/>`;
  o += `</g>`;
  o += g(bubble(200, 150, '？', { size: 100, tail: 'left' }), { x: 1800, y: 560 });
  const T = (y, inner, size) => `<text x="70" y="${y}" font-size="${size}" font-weight="900" letter-spacing="0.02em" fill="${C.ink}" stroke="#fffaf0" stroke-width="26" stroke-linejoin="round" paint-order="stroke" dominant-baseline="middle">${inner}</text>`;
  o += T(390, `<tspan fill="${C.blueUi}">エレベーター</tspan>は`, 170);
  o += T(620, `どうやって <tspan fill="${C.redUi}">上がる</tspan>？`, 170);
  o += `<g transform="translate(260 1060) scale(0.62)">${sister(0.3, { pose: 'point', eyes: 'wide', mouth: 'open', look: [6, -8] })}</g>`;
  o += g(badge('みのまわり図鑑', { fill: C.accent, size: 54, pad: 50 }), { x: 720, y: 880 });
  document.getElementById('stage').innerHTML = o;
  document.getElementById('cap').style.display = 'none';
}
</script>
</body>
</html>
